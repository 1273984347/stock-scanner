name: Test

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install OpenMP (macOS only)
        # xgboost/lightgbm wheel 依赖 libomp.dylib (OpenMP runtime), macOS runner 默认不装
        if: matrix.os == 'macos-latest'
        run: brew install libomp
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install xgboost lightgbm scikit-learn
      - name: Warm up matplotlib and akshare (diagnostic pre-warm)
        # 带 coverage 时 test_backtest_charts_cleanup::test_temp_charts_cleans_up_on_exit
        # 在三平台偶发失败：KeyError: 'packaging'（matplotlib 自身不引用 packaging，
        # 疑似 py_mini_racer -> pkg_resources -> importlib.metadata 的元数据查找，
        # 且只在首次触发图表路径时发生）。
        # 这里**真正画一张图并保存** + import akshare，把这两条可疑路径提前到
        # 测试之前：要么提前暴露根因（步骤会红），要么消除测试内的偶发。
        if: matrix.python-version == '3.12'
        run: python -c "import matplotlib; matplotlib.use('Agg'); import matplotlib.pyplot as plt; import io; f,a=plt.subplots(); a.plot([1,2,3]); b=io.BytesIO(); f.savefig(b, format='png'); plt.close('all'); import akshare; print('prewarm ok')"
      - name: Contract snapshot check (API 契约漂移门禁)
        # 契约与 Python 小版本无关 —— 只在 3.12 上跑，覆盖 3 个 OS 而非 9 个 job
        # 放在 pytest 之前：门禁须能快速失败，不受全量测试耗时影响
        if: matrix.python-version == '3.12'
        env:
          # 跳过 api 模块 import 期的 akshare 行情预取，保证门禁零网络副作用
          SKIP_HS300_PREFETCH: '1'
        run: python scripts/contract_snapshot.py --check
      - name: Run tests (with coverage baseline)
        # 只在 3.12 上带覆盖率跑：覆盖率高才能给出可比的基线，
        # 且**替换**普通测试步骤（不额外再跑一遍，避免 CI 时间翻倍）
        if: matrix.python-version == '3.12'
        env:
          SKIP_HS300_PREFETCH: '1'
        # 单行命令：Windows runner 默认 shell 是 PowerShell，bash 的反斜杠续行符
        # 会直接触发 ParserError（实测已踩）=> 不用续行符，零 shell 依赖
        run: pytest tests/ -v --tb=short --cov=lib --cov=api --cov=config --cov=factors --cov=scanner --cov=paper_trading --cov=trading_journal --cov=dashboard --cov-report=json:coverage.json --cov-report=term
      - name: Coverage baseline gate
        # 按平台与自己的历史基线比对（分支覆盖在三平台本就不同，
        # 单一阈值硬卡必然误判）。该平台尚无基线时只报告不阻断。
        if: matrix.python-version == '3.12'
        run: python scripts/coverage_baseline.py --check --coverage-file coverage.json
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest tests/ -v --tb=short
