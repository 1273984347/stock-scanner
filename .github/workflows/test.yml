name: Test

on:
  # 公开仓：标准 runner 免费，恢复 push/PR 自动门禁（默认 3.12 × 3 OS）。
  # 需要 Python 3.10/3.11 兼容性验证时手动 workflow_dispatch 跑完整矩阵。
  #
  # P0-1（2026-11-26 CI 性能诊断）：纯文档/治理文件提交不触发全量 3 OS 矩阵。
  # 实测 8 次运行中 3 次（37.5%）由纯文档提交触发，消耗 35.6% 执行分钟；
  # 那 3 次提交改动的文件全部是 .md 或根目录 LICENSE，本规则精确覆盖 3/3。
  # paths-ignore 语义 =「所有改动文件都命中忽略列表才跳过」⇒ 混合提交（文档+代码）仍会触发。
  # 与 AGENTS.md §7.1 的 [skip ci] 纪律同向：把软纪律变成机制保障，不再依赖提交者自觉。
  # 只忽略 .md 与 LICENSE，**刻意不忽略 docs/**：
  #   docs/ 下 14 个 .json 是门禁判据基线（dual-run / backtest / openapi / route-contract 等），
  #   基线更新必须触发 CI 验证，否则基线漂移不会被发现。
  #   （GitHub 的 paths-ignore 不支持 ! 否定语法，无法在黑名单里开豁免。）
  # 已实测本仓 master 无分支保护 / 无 ruleset / 无 required status check
  # （branches/master/protection -> 404、rulesets -> []），
  # 故跳过不会造成 required check 永久 pending；
  # 若将来启用分支保护，必须补一个恒绿 stub job。
  # 不要忽略 .github/**：改 workflow 自身必须触发 CI 以验证新配置。
  # 两个 .md 模式并存是刻意防御：GitHub 对 ** 的 glob 方言有两种表述
  # （「** 作为完整路径段跨目录」与「** 匹配任意字符含 /」），
  # **/*.md 覆盖前者、**.md 覆盖后者 ⇒ 根目录与任意层级的 .md 都被忽略。
  push:
    paths-ignore:
      - '**/*.md'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

# P0-5（2026-11-26 CI 性能诊断）：并发组收敛，让「新 push 取消旧 run」从被动变显式。
# 实测 8 次运行互相重叠：新 push 到达后 GitHub 被动取消旧 run
# （run 45659474127 的 macOS job 已跑 159s 后被取消 ≈ 155s 作废）。
# 注意：master 直推时会取消在跑的旧 run（与 GitHub 当前实际行为一致）；
# 若需保证 master 完整跑完，请把 cancel-in-progress 改为 false。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    # 实测最长 job 417s（windows, run 45668417667）≈ 7min ⇒ 30min 留 >4× 余量。
    # 原本无上限 ⇒ 卡死 job 可烧满默认 360min。
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Actions 额度有限：push/pull_request 默认只跑 3.12（3 个 job ≈ 39 Linux-分钟）。
        # 需要 Python 3.10/3.11 兼容性验证时手动触发 workflow_dispatch ⇒ 跑完整 9 个 job。
        # ⚠️ 必须在 **matrix 层**过滤：job 级 if 在 matrix 展开前求值，引用 matrix.* 会让
        # workflow 直接失败（"likely failed because of a workflow file issue"）。
        python-version: ${{ fromJSON(github.event_name == 'workflow_dispatch' && '["3.10","3.11","3.12"]' || '["3.12"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 门禁用 git show <历史 SHA> 复算迁移等价性；默认 depth=1 会让历史不可读
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # P0-2（2026-11-26 CI 性能诊断）：开 pip 缓存。
          # 实测此前零命中：每次重下 88 个包，Install dependencies 均值 60.2s
          #（windows 95.0s）。key 由 setup-python 自动按 OS + Python 版本 +
          # requirements.txt 哈希生成 ⇒ 改依赖即换 key，不会串版。
          # 注意 requirements.txt 只有区间约束、无锁文件 ⇒ 同一 key 下 pip 可能解析到
          # 更新的区间内版本（缓存只省下载、不省解析）⇒ 命中率会打折但不会装错版本。
          cache: 'pip'
          cache-dependency-path: requirements.txt
      - name: Install OpenMP (macOS only)
        # xgboost/lightgbm wheel 依赖 libomp.dylib (OpenMP runtime), macOS runner 默认不装
        if: matrix.os == 'macos-latest'
        run: brew install libomp
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install xgboost lightgbm scikit-learn
      - name: Contract snapshot check (API 契约漂移门禁)
        # 契约与 Python 小版本无关 —— 只在 3.12 上跑，覆盖 3 个 OS 而非 9 个 job
        # 放在 pytest 之前：门禁须能快速失败，不受全量测试耗时影响
        if: matrix.python-version == '3.12'
        env:
          # 跳过 api 模块 import 期的 akshare 行情预取，保证门禁零网络副作用
          SKIP_HS300_PREFETCH: '1'
        run: python scripts/gates/contract_snapshot.py --check
      - name: Run tests (with coverage baseline)
        # 只在 3.12 上带覆盖率跑：覆盖率高才能给出可比的基线，
        # 且**替换**普通测试步骤（不额外再跑一遍，避免 CI 时间翻倍）
        if: matrix.python-version == '3.12'
        env:
          SKIP_HS300_PREFETCH: '1'
        # 单行命令：Windows runner 默认 shell 是 PowerShell，bash 的反斜杠续行符
        # 会直接触发 ParserError（实测已踩）=> 不用续行符，零 shell 依赖
        run: pytest tests/ -v --tb=short --cov=lib --cov=backtest --cov=api --cov=config --cov=factors --cov=scanner --cov=paper_trading --cov=trading_journal --cov=dashboard --cov-report=json:coverage.json --cov-report=term
      - name: Coverage baseline gate
        # 按平台与自己的历史基线比对（分支覆盖在三平台本就不同，
        # 单一阈值硬卡必然误判）。该平台尚无基线时只报告不阻断。
        if: matrix.python-version == '3.12'
        run: python scripts/gates/coverage_baseline.py --check --coverage-file coverage.json
      - name: Dual-run diff (行为漂移门禁)
        # 同一份注入数据下比对 3 条链路的**实际结果**（比契约快照更深：
        # 契约快照只看路径+schema，这里看数值与字段内容）。
        # 基线来自 docs/refactor/dual-run-baseline.json（由旧实现 --capture 生成），
        # Phase N 改动后本步骤即判定"行为是否改变"。
        if: matrix.python-version == '3.12'
        run: python scripts/gates/dual_run_diff.py --check --out docs/refactor/dual-run-baseline.json
      - name: Backtest baseline (回测口径漂移门禁)
        # 回测数值是**策略决策依据**（RF-01 风险登记 R6：错一位可能误导后续所有优化）。
        # 本门禁比对 4 条链路的输出：
        #   entry_signals          —— 三份 check_entry 的判定序列（口径本身）
        #   core_factor_backtest   —— 因子回测主链路
        #   engine_donchian_entry  —— 单股信号回测（Donchian 口径）
        #   engine_multi_signal_entry —— 同上（多信号口径）
        # 全部用**确定性合成数据**（zlib.crc32 种子），跨环境可复现。
        if: matrix.python-version == '3.12'
        run: python scripts/gates/backtest_baseline.py --check --out docs/refactor/backtest-baseline.json
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage.json
      - name: Run tests
        if: matrix.python-version != '3.12'
        run: pytest tests/ -v --tb=short
