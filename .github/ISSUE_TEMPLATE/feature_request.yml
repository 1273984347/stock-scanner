name: 功能建议
description: 提出新功能或改进建议；大改动请先开 Issue 对齐范围
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        本仓为个人维护的 A 股量化研究工具，范围以 [ROADMAP.md](https://github.com/1273984347/stock-scanner/blob/master/ROADMAP.md) 为准。
        大改动先在此对齐范围，避免写完才发现方向不一致（见 CONTRIBUTING.md）。

  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明使用场景与当前痛点，而非仅描述期望的实现
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提议方案
      description: 期望的行为或接口；涉及 lib/ 时请说明归属子包（见 AGENTS.md §1.3）
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案与代价
      description: 考虑过的其他做法及放弃原因
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 不涉及评分口径数值变化（若涉及，需走 ADR 与对拍）
          required: false
        - label: 不涉及回测口径变化（若涉及，需走 backtest.unified 与对拍）
          required: false
        - label: 已阅读 ROADMAP.md 的 Non-goals，本建议不越界
          required: true
