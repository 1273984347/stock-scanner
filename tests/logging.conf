[loggers]
keys=root,quant

[handlers]
keys=console

[formatters]
keys=simple

[logger_root]
level=INFO
handlers=console

[logger_quant]
level=DEBUG
handlers=console
qualname=lib
propagate=0

[handler_console]
class=StreamHandler
level=DEBUG
formatter=simple
args=(sys.stdout,)

[formatter_simple]
format=%(asctime)s [%(levelname)s] %(name)s: %(message)s
datefmt=%H:%M:%S
